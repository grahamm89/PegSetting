
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dilution Calculator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="diagPanel" style="display:none;position:fixed;left:12px;bottom:12px;z-index:2000;background:#222;color:#fff;padding:10px 12px;border-radius:10px;max-width:360px;box-shadow:0 2px 12px rgba(0,0,0,.3);font:13px/1.35 system-ui;">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;">
      <b>Diagnostics</b>
      <button id="diagClose" style="background:#444;color:#fff;border:0;border-radius:6px;padding:4px 8px;cursor:pointer">×</button>
    </div>
    <div id="diagLog" style="white-space:pre-wrap;max-height:200px;overflow:auto;"></div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
      <button id="bypassSW" style="background:#0b5;color:#fff;border:0;border-radius:6px;padding:6px 8px;cursor:pointer">Bypass SW (10 min)</button>
      <button id="openAdminBtn" style="background:#555;color:#fff;border:0;border-radius:6px;padding:6px 8px;cursor:pointer">Open Admin</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h1>Dilution Calculator</h1>
      <label for="product">Product:</label>
      <select id="product"></select>
      <label for="method">Application Method:</label>
      <select id="method"></select>
      <label for="pressure">Pressure:</label>
      <select id="pressure"></select>
      <div id="result">Select options to see result.</div>
      <div id="minmax" class="minmax"></div>
      <footer>Offline ready. <span id="stamp"></span></footer>
    </div>
  </div>

  <div id="adminOverlay" class="overlay">
    <div class="modal">
      <div class="toolbar">
        <button id="uploadBtn">Upload JSON</button>
        <input id="uploadInput" type="file" accept="application/json" style="display:none">
        <button id="addRow">Add Row</button>
        <button id="newVersion">New Version</button>
        <button id="downloadData" class="primary">Download JSON</button>
        <button id="closeAdmin">Close</button>
      </div>
      <div class="table-wrap">
        <table id="dataTable">
          <thead>
            <tr><th>Product</th><th>Method</th><th>Pressure</th><th>PEG</th><th>Dilution</th><th>Min</th><th>Max</th><th>Del</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="hint">Edits affect your local preview. Click <b>Download JSON</b>, then upload it to GitHub to publish.</p>
    </div>
  </div><button id="openAdminBtn" style="position:fixed;right:12px;bottom:12px;z-index:1000;">Admin</button>
<script defer src="js/app.js"></script>
<script defer src="js/limits.js"></script>
<script defer src="js/admin-inline.js"></script>
<script defer src="js/pwa.js"></script>

</body>
</html>
