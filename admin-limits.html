<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — PEG Min/Max</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .toolbar { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
    .toolbar input[type="text"]{ min-width:220px; }
    #status { font-size:.9em; opacity:.75; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Admin — PEG Min/Max</h1>
      <p class="hint">Edit <b>limits.json</b>. Use the buttons below to add rows and then <b>Download JSON</b> to save changes.</p>
      <div id="loginBox">
        <input type="password" id="password" placeholder="Password" />
        <button id="loginBtn">Login</button>
      </div>
      <div id="adminBox" style="display:none">
        <div class="toolbar">
          <button id="addRow">+ Add Row</button>
          <button id="addMissing">+ Add Missing Products</button>
          <button id="download">Download JSON</button>
          <span id="status"></span>
        </div>
        <table id="limitsTable">
          <thead>
            <tr><th>Product</th><th>Min</th><th>Max</th><th>Del</th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="hint">After downloading, upload the file as <b>limits.json</b> in GitHub and commit.</p>
        <p><a href="admin.html">← Back to main admin</a></p>
      </div>
    </div>
  </div>
  <script src="js/admin-limits.js"></script>
</body>
</html>
